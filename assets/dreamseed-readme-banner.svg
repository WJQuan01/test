<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">{{项目名称}} - DreamSeed 种梦计划参赛作品</title>
  <desc id="desc">DreamField AI 算力平台与 DreamSeed 种梦计划 README 顶部横幅模板</desc>

  <!-- Background -->
  <rect width="1280" height="420" rx="24" fill="#0A0F1C"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#20B883" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20B883" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#20B883" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2587E6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2587E6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F4B344" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F4B344" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#20B883" stop-opacity="0"/>
      <stop offset="50%" stop-color="#20B883" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2587E6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>

  <!-- Ambient glow circles -->
  <circle cx="1100" cy="100" r="220" fill="#20B883" fill-opacity="0.12" filter="url(#blur2)"/>
  <circle cx="950" cy="320" r="180" fill="#2587E6" fill-opacity="0.1" filter="url(#blur2)"/>
  <circle cx="1150" cy="350" r="140" fill="#F4B344" fill-opacity="0.08" filter="url(#blur2)"/>
  <circle cx="200" cy="50" r="100" fill="#20B883" fill-opacity="0.06" filter="url(#blur1)"/>

  <!-- Connection lines (neural network feel) -->
  <path d="M880 80 C940 120, 1020 100, 1100 80" stroke="#20B883" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
  <path d="M920 180 C980 160, 1060 190, 1160 160" stroke="#2587E6" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round"/>
  <path d="M900 280 C960 260, 1040 300, 1120 270" stroke="#F4B344" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round"/>
  <path d="M950 340 C1010 320, 1080 350, 1180 330" stroke="#F97363" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="880" cy="80" r="6" fill="#20B883" fill-opacity="0.8"/>
  <circle cx="1100" cy="80" r="6" fill="#20B883" fill-opacity="0.6"/>
  <circle cx="920" cy="180" r="6" fill="#2587E6" fill-opacity="0.8"/>
  <circle cx="1160" cy="160" r="6" fill="#2587E6" fill-opacity="0.6"/>
  <circle cx="900" cy="280" r="6" fill="#F4B344" fill-opacity="0.8"/>
  <circle cx="1120" cy="270" r="6" fill="#F4B344" fill-opacity="0.6"/>
  <circle cx="1180" cy="330" r="5" fill="#F97363" fill-opacity="0.6"/>
  <circle cx="950" cy="340" r="5" fill="#F97363" fill-opacity="0.5"/>

  <!-- Sparkle dots -->
  <circle cx="1020" cy="60" r="2" fill="#FFFFFF" fill-opacity="0.4"/>
  <circle cx="1080" cy="220" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  <circle cx="1000" cy="360" r="2" fill="#FFFFFF" fill-opacity="0.25"/>
  <circle cx="1200" cy="120" r="1.5" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="1140" cy="380" r="1.5" fill="#FFFFFF" fill-opacity="0.2"/>

  <!-- Left content area -->
  <g transform="translate(64 36)">
    <!-- Top pill badge -->
    <rect x="0" y="0" width="520" height="32" rx="16" fill="#20B883" fill-opacity="0.12" stroke="#20B883" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="18" cy="16" r="5" fill="#20B883"/>
    <circle cx="34" cy="16" r="5" fill="#2587E6"/>
    <circle cx="50" cy="16" r="5" fill="#F4B344"/>
    <text x="68" y="21" fill="#20B883" font-size="14" font-family="Inter, Arial, 'PingFang SC', sans-serif" font-weight="700" letter-spacing="0.5">DreamField AI Compute Platform</text>
    <text x="328" y="21" fill="#6B7280" font-size="14" font-family="Inter, Arial, 'PingFang SC', sans-serif" font-weight="500">·</text>
    <text x="342" y="21" fill="#F4B344" font-size="14" font-family="Inter, Arial, 'PingFang SC', sans-serif" font-weight="700">DreamSeed 种梦计划</text>

    <!-- Main title -->
    <text x="0" y="100" fill="#FFFFFF" font-size="54" font-family="Inter, Arial, 'PingFang SC', sans-serif" font-weight="900" letter-spacing="-0.5">{{项目名称}}</text>

    <!-- Subtitle -->
    <text x="0" y="140" fill="#94A3B8" font-size="22" font-family="Inter, Arial, 'PingFang SC', sans-serif" font-weight="500">{{项目一句话介绍}}</text>

    <!-- Tag pills -->
    <g transform="translate(0 172)">
      <rect x="0" y="0" width="108" height="34" rx="17" fill="#20B883" fill-opacity="0.2" stroke="#20B883" stroke-opacity="0.5" stroke-width="1"/>
      <text x="54" y="23" text-anchor="middle" fill="#20B883" font-size="14" font-family="Inter, Arial, 'PingFang SC', sans-serif" font-weight="700">{{分类}}</text>

      <rect x="124" y="0" width="124" height="34" rx="17" fill="#2587E6" fill-opacity="0.2" stroke="#2587E6" stroke-opacity="0.5" stroke-width="1"/>
      <text x="186" y="23" text-anchor="middle" fill="#2587E6" font-size="14" font-family="Inter, Arial, 'PingFang SC', sans-serif" font-weight="700">造梦者作品</text>

      <rect x="264" y="0" width="148" height="34" rx="17" fill="#F4B344" fill-opacity="0.2" stroke="#F4B344" stroke-opacity="0.5" stroke-width="1"/>
      <text x="338" y="23" text-anchor="middle" fill="#F4B344" font-size="14" font-family="Inter, Arial, 'PingFang SC', sans-serif" font-weight="700">AI创造者大赛</text>
    </g>

    <!-- Divider line -->
    <rect x="0" y="230" width="480" height="1" fill="url(#lineGrad)"/>

    <!-- Bottom info line -->
    <text x="0" y="258" fill="#64748B" font-size="15" font-family="Inter, Arial, 'PingFang SC', sans-serif" font-weight="600">DreamSeed 种梦计划 — AI创造者大赛</text>
    <text x="0" y="282" fill="#20B883" font-size="15" font-family="'Courier New', monospace" font-weight="700">https://www.dreamfield.top</text>

    <!-- Powered by line -->
    <text x="0" y="316" fill="#475569" font-size="12" font-family="Inter, Arial, 'PingFang SC', sans-serif" font-weight="500">Powered by DreamField AI 算力平台 · 50万元现金奖励 · GitHub 开源排名赛</text>
  </g>

  <!-- Right side: abstract seed/compute graphic -->
  <g transform="translate(960 120)">
    <!-- Seed shape (central element) -->
    <ellipse cx="60" cy="80" rx="40" ry="50" fill="none" stroke="#20B883" stroke-opacity="0.4" stroke-width="2"/>
    <ellipse cx="60" cy="80" rx="28" ry="36" fill="none" stroke="#20B883" stroke-opacity="0.25" stroke-width="1.5"/>
    <ellipse cx="60" cy="80" rx="16" ry="22" fill="#20B883" fill-opacity="0.15"/>

    <!-- Radiating rings -->
    <circle cx="60" cy="80" r="70" fill="none" stroke="#20B883" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="60" cy="80" r="100" fill="none" stroke="#2587E6" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="6 8"/>
    <circle cx="60" cy="80" r="140" fill="none" stroke="#F4B344" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="8 10"/>

    <!-- Orbiting dots -->
    <circle cx="130" cy="80" r="4" fill="#20B883" fill-opacity="0.7"/>
    <circle cx="60" cy="-20" r="3" fill="#2587E6" fill-opacity="0.6"/>
    <circle cx="-40" cy="80" r="3.5" fill="#F4B344" fill-opacity="0.6"/>
    <circle cx="60" cy="180" r="3" fill="#F97363" fill-opacity="0.5"/>

    <!-- Small connecting lines to orbiting dots -->
    <line x1="100" y1="80" x2="126" y2="80" stroke="#20B883" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="60" y1="40" x2="60" y2="-17" stroke="#2587E6" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="20" y1="80" x2="-37" y2="80" stroke="#F4B344" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="60" y1="120" x2="60" y2="177" stroke="#F97363" stroke-opacity="0.2" stroke-width="1"/>
  </g>
</svg>
